name: Orbit Form Builder
slug: orbit-form-builder
summary: Visually build Orbit forms from every field and layout, then collect answers with handlers.
description: |
  ## What it does

  Design dynamic forms inside your Orbit panel with a drag-drop tree canvas,
  nested layouts (sections, grids, columns), an inspector, and a live preview.
  Definition JSON is a readonly export. Publish a form, share a fill page, and
  store answers with optional email, webhook, or custom callable handlers.
  Multi-tenant panels keep definitions and submissions scoped by tenant.

  ## Install

  ```bash
  pip install almasix-orbit-form-builder
  ```

  ```python
  from almasix_orbit_form_builder import FormBuilderPlugin, bootstrap_memory_store

  bootstrap_memory_store()
  panel.plugin(FormBuilderPlugin.make().navigation_group("Forms"))
  ```

  Requires Orbit 0.5.3+. Full README: [almasix-orbit-form-builder](https://github.com/almasix-dev/almasix-orbit-form-builder).
